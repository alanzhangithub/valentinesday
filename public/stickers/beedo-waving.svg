<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Beedo - Waving Pose (with bow) -->

  <!-- Striped Tail -->
  <path d="M155 140 Q180 150 185 170 Q190 185 175 185 Q165 185 160 175 Q150 160 145 150" fill="white" stroke="black" stroke-width="3"/>
  <line x1="178" y1="175" x2="165" y2="165" stroke="black" stroke-width="4"/>
  <line x1="172" y1="180" x2="158" y2="168" stroke="black" stroke-width="4"/>
  <line x1="182" y1="168" x2="170" y2="158" stroke="black" stroke-width="4"/>

  <!-- Body (round) -->
  <ellipse cx="100" cy="115" rx="55" ry="50" fill="white" stroke="black" stroke-width="3"/>

  <!-- Left Ear -->
  <path d="M55 55 L70 85 L40 80 Z" fill="black" stroke="black" stroke-width="2"/>

  <!-- Right Ear -->
  <path d="M145 55 L130 85 L160 80 Z" fill="black" stroke="black" stroke-width="2"/>

  <!-- Head patch (black area on right side - mirrored from meedo) -->
  <path d="M145 55 C150 70 150 90 130 100 C115 105 105 95 105 80 C105 65 115 55 125 50 C135 45 145 50 145 55" fill="black"/>

  <!-- Bow on head -->
  <path d="M85 45 Q70 35 65 45 Q60 55 75 55 Q80 55 85 50" fill="white" stroke="black" stroke-width="2"/>
  <path d="M85 45 Q100 35 105 45 Q110 55 95 55 Q90 55 85 50" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="85" cy="50" r="6" fill="white" stroke="black" stroke-width="2"/>

  <!-- Left Eye (white circle with black pupil) -->
  <circle cx="80" cy="90" r="18" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="78" cy="88" r="10" fill="black"/>

  <!-- Right Eye -->
  <circle cx="120" cy="90" r="18" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="118" cy="88" r="10" fill="black"/>

  <!-- Nose -->
  <ellipse cx="100" cy="110" rx="5" ry="4" fill="black"/>

  <!-- Mouth (happy smile) -->
  <path d="M90 118 Q100 130 110 118" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Arm/Paw (waving up!) -->
  <path d="M50 110 Q25 90 20 70 Q18 60 25 60 Q32 62 35 75 Q40 90 50 100" fill="white" stroke="black" stroke-width="2"/>

  <!-- Wave lines -->
  <path d="M15 55 Q10 50 5 55" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 65 Q7 60 2 65" fill="none" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Arm/Paw (down) -->
  <path d="M145 130 Q160 140 155 150 Q150 155 145 150 Q142 145 140 140" fill="white" stroke="black" stroke-width="2"/>
</svg>
